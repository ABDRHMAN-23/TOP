name: Materialize Sinan workspace
on:
  push:
    branches:
      - rebuild/sinan-bootstrap
    paths:
      - 'sinan_bundle/GO'
permissions:
  contents: write
jobs:
  restore-and-replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/sinan-bootstrap
          persist-credentials: true
      - name: Reassemble source archive from Git objects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/sinan"
          : > "${RUNNER_TEMP}/archive.b64"
          for f in sinan_bundle/part01.txt sinan_bundle/part02.txt sinan_bundle/part03.txt sinan_bundle/part04.txt sinan_bundle/part05.txt sinan_bundle/part06.txt; do
            cat "$f" >> "${RUNNER_TEMP}/archive.b64"
          done
          blobs=(
            fb5442ce7e7d409c73956f33e3d11169e6b9d9e6
            b17d00c06909bb598c41ea6a0be958abc58bc8d2
            a1b4d85aad928707777a907465d4f5a4f09589ea
            6b507db7887dadefb3293d99a1f4abc83193c70d
            b3db336274f5d882a3ff96f57a21370f1d86c976
            ed799f13927c52a3859a922da2eafc66bb1712a4
            75a4ab07acf6e498709e867211741fbc8ea91c39
            b3d70304a032ca31b6cbd16b9bd16a32ae1fb850
            e50fd84ffe42db32822464ecb10178828acf6d34
            5b46ae31539e9edd34c7c89930465b4f92ab1975
          )
          for sha in "${blobs[@]}"; do
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/ABDRHMAN-23/TOP/git/blobs/${sha}" \
              | jq -r '.content' | tr -d '\n' | base64 --decode >> "${RUNNER_TEMP}/archive.b64"
          done
          base64 --decode "${RUNNER_TEMP}/archive.b64" | tar -xz -C "${RUNNER_TEMP}/sinan"
      - name: Replace tracked project contents with Sinan
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf -- {} +
          cp -a "${RUNNER_TEMP}/sinan/." .
          rm -rf sinan_bundle
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Replace TOP repository with Sinan Dental Clinical Workspace"
          git push origin HEAD:rebuild/sinan-bootstrap
