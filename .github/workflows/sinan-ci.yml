name: Sinan CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run safety and invariant tests
        run: npm test
      - name: Validate runtime configuration
        run: npm run preflight
      - name: Type-check
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_DEMO_MODE: "true"
      # Validate the actual Cloudflare/OpenNext build on PRs without deploying or
      # requiring Cloudflare credentials. This catches failures that plain next build misses.
      - name: Build for Cloudflare Workers (validation only)
        run: npm run build:cloudflare
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
          NEXT_PUBLIC_DEMO_MODE: "false"

      - name: Verify OpenNext output exists
        run: |
          test -s .open-next/worker.js
          test -d .open-next/assets

      - name: Upload generated npm lockfile
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sinan-npm-lockfile
          path: package-lock.json
          if-no-files-found: error
