name: CI

permissions:
  contents: write

on:
  push:
    branches: [main, migration/aqarflow-ai, 'integration/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Commit generated lockfile once on the integration branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/integration/level-1-crm-whatsapp-promptfoo'
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already tracked."
            exit 0
          fi
          test -s package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: pin npm dependency graph"
          git push origin HEAD:integration/level-1-crm-whatsapp-promptfoo
      - name: Export generated lockfile for one-time repository pinning
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-generated
          path: package-lock.json
          if-no-files-found: error
      - run: npm run test:price
      - run: npm run test:advisor:requirement
      - run: npm run test:aqarflow:sales
      - run: npm run test:aqarflow:runtime
      - run: npm run test:aqarflow:migration
      - run: npm run test:aqarflow:analyze-contract
      - run: npm run validate:aqarflow:promptfoo
      - run: npm run test:aqarflow:whatsapp-cloud
      - run: npm run test:safe-redirect
      - run: npm run test:legal-consent
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          SUPABASE_SECRET_KEY: sb_secret_placeholder
      - run: npm run build:cloudflare
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          SUPABASE_SECRET_KEY: sb_secret_placeholder
