name: Deploy Sinan runtime-enabled app to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "public/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - ".env.example"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - "open-next.config.ts"
      - ".github/workflows/deploy-sinan-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sinan-cloudflare-sinan-live
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy Sinan runtime-enabled app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Next.js embeds NEXT_PUBLIC_* variables into the browser bundle at BUILD time.
      # These are Supabase's public URL and publishable key; RLS and Auth remain the security boundary.
      NEXT_PUBLIC_SUPABASE_URL: "https://djpfjbjjybpquvzacmtj.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_TkjtLbzWTqXlE18tcvGpow_XFxdTvmz"
      NEXT_PUBLIC_DEMO_MODE: "false"
      # Private Gemini key and other private settings are read from Cloudflare Worker runtime secrets/vars.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployment credentials are configured
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN; no deployment was attempted."
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::Missing or invalid GitHub Actions secret CLOUDFLARE_ACCOUNT_ID; no deployment was attempted."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run invariant and safety tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Validate live public configuration
        run: npm run preflight

      - name: Build for Cloudflare Workers
        run: npm run build:cloudflare

      - name: Verify OpenNext output exists
        shell: bash
        run: |
          test -s .open-next/worker.js
          test -d .open-next/assets

      - name: Deploy Sinan app to Cloudflare Workers
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Attach Gemini server secret from repository secret when available
        shell: bash
        env:
          GEMINI_SECRET_INPUT: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY || secrets.GOOGLE_GEMINI_API_KEY || secrets.GOOGLE_GENAI_API_KEY }}
        run: |
          if [[ -n "${GEMINI_SECRET_INPUT:-}" ]]; then
            printf '%s' "$GEMINI_SECRET_INPUT" | npx wrangler secret put GEMINI_API_KEY --config wrangler.jsonc
            echo "Gemini server secret was attached to the deployed Worker without printing its value."
          else
            echo "::warning::No supported Gemini key was available as a GitHub Actions secret. Existing Worker secret bindings remain untouched."
          fi

      - name: Check Gemini secret binding names without reading secret values
        shell: bash
        run: |
          npx wrangler secret list --config wrangler.jsonc > /tmp/sinan-secret-names.json
          node - /tmp/sinan-secret-names.json <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const list = Array.isArray(payload) ? payload : (Array.isArray(payload.result) ? payload.result : []);
          const names = list.map(item => String(item.name || '')).filter(name => /GEMINI|GOOGLE.*API|GENAI/i.test(name));
          const expected = ['GEMINI_API_KEY','GOOGLE_API_KEY','GOOGLE_GEMINI_API_KEY','GOOGLE_GENAI_API_KEY','GOOGLE_GENERATIVE_AI_API_KEY','GEMINI_KEY'];
          console.log(JSON.stringify({ geminiSecretBindingNames: names, knownNamePresent: expected.some(name => names.includes(name)) }));
          NODE

      - name: Read deployed binding names only (never log values)
        shell: bash
        run: |
          curl --silent --show-error --fail \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/aqarflow-ai1/settings" \
            -o /tmp/sinan-worker-settings.json
          node - /tmp/sinan-worker-settings.json <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (payload.success !== true) {
            console.log(JSON.stringify({ bindingMetadataAvailable: false }));
            process.exit(0);
          }
          const bindings = Array.isArray(payload.result?.bindings) ? payload.result.bindings : [];
          const safeBindings = bindings.map(({name, type}) => ({name, type}));
          const relevant = safeBindings.filter(x => /SUPABASE|DEMO|GEMINI|GOOGLE|GENAI|AUDIO|MODEL/i.test(String(x.name || '')));
          console.log(JSON.stringify({ bindingMetadataAvailable: true, relevantBindings: relevant }));
          NODE

      - name: Check previous Worker versions for existing Gemini bindings (names only)
        shell: bash
        run: |
          curl --silent --show-error --fail \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/aqarflow-ai1/versions?per_page=10" \
            -o /tmp/sinan-worker-versions.json
          node - /tmp/sinan-worker-versions.json <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const versions = Array.isArray(p.result) ? p.result : [];
          console.log(JSON.stringify({previousWorkerVersionCount: Math.max(0,versions.length-1), versions: versions.map(v=>({id:v.id,number:v.number,created_on:v.metadata?.created_on,source:v.metadata?.source}))}));
          NODE
          for version in $(node -e "const p=require('/tmp/sinan-worker-versions.json'); console.log((p.result||[]).slice(1,10).map(v=>v.id).filter(Boolean).join(' '))"); do
            curl --silent --show-error --fail \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/aqarflow-ai1/versions/$version" \
              -o /tmp/sinan-old-version.json
            node - /tmp/sinan-old-version.json <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const bindings = p.result?.resources?.bindings || p.result?.bindings || [];
          const relevant = bindings.filter(b=>/GEMINI|GOOGLE.*API|GENAI/i.test(String(b.name||''))).map(b=>({name:b.name,type:b.type}));
          if (relevant.length) console.log(JSON.stringify({versionNumber:p.result?.number,geminiBindingNames:relevant}));
          NODE
          done

      - name: Verify signup page and compiled browser Supabase configuration
        shell: bash
        run: |
          base="https://aqarflow-ai1.abdrhmanahmd2022.workers.dev"
          page_status="$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused --output /tmp/sinan-sign-up.html --write-out "%{http_code}" "$base/sign-up")"
          node - "$page_status" /tmp/sinan-sign-up.html <<'NODE'
          const fs = require('node:fs');
          const status = Number(process.argv[2]);
          const html = fs.readFileSync(process.argv[3], 'utf8');
          const formRendered = html.includes('إنشاء حساب طبيب أو مدير عيادة');
          const directEntryRendered = html.includes('إنشاء حساب') || html.includes('sign-up');
          console.log(JSON.stringify({ signupPageStatus: status, signupFormRendered: formRendered, signupEntryRendered: directEntryRendered }));
          if (status !== 200 || !formRendered) process.exit(1);
          NODE
          grep -oE '/_next/static/[^" ]+\.js' /tmp/sinan-sign-up.html | sort -u > /tmp/sinan-js-chunks.txt
          : > /tmp/sinan-client-bundle.js
          while IFS= read -r chunk; do
            curl --silent --show-error --fail --retry 3 --retry-delay 1 "$base$chunk" >> /tmp/sinan-client-bundle.js
            printf '\\n' >> /tmp/sinan-client-bundle.js
          done < /tmp/sinan-js-chunks.txt
          node - /tmp/sinan-client-bundle.js <<'NODE'
          const fs = require('node:fs');
          const js = fs.readFileSync(process.argv[2], 'utf8');
          const projectUrlPresent = js.includes('djpfjbjjybpquvzacmtj.supabase.co');
          const publishableKeyPresent = js.includes('sb_publishable_');
          const placeholderPresent = /YOUR_PROJECT\\.supabase\\.co|YOUR_SUPABASE_ANON_KEY/.test(js);
          console.log(JSON.stringify({ compiledSupabaseProjectPresent: projectUrlPresent, compiledPublicKeyPresent: publishableKeyPresent, stalePlaceholderPresent: placeholderPresent }));
          if (!projectUrlPresent || !publishableKeyPresent || placeholderPresent) process.exit(1);
          NODE

      - name: Smoke-test deployed Supabase and runtime configuration
        shell: bash
        run: |
          url="https://aqarflow-ai1.abdrhmanahmd2022.workers.dev/api/health/ready"
          curl --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused \
            --output /tmp/sinan-readiness.json --write-out "%{http_code}" "$url" > /tmp/sinan-readiness-status
          status="$(cat /tmp/sinan-readiness-status)"
          node - "$status" /tmp/sinan-readiness.json <<'NODE'
          const fs = require('node:fs');
          const status = Number(process.argv[2]);
          const payload = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          console.log(JSON.stringify({ httpStatus: status, ready: payload.ready, checks: payload.checks }));
          if (status !== 200 || payload.ready !== true) process.exit(1);
          NODE

      # One-time end-to-end test. It uses a disposable mailbox and non-clinical fake data, then the DB test rows are removed manually after the run.
      - name: Run one-time Sinan signup and clinical API E2E check
        if: github.event_name == 'push' && github.event.head_commit.message == 'Run one-time Sinan account and clinic smoke test'
        timeout-minutes: 8
        shell: bash
        env:
          AUTH_BASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          AUTH_PUBLIC_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          APP_BASE_URL: "https://aqarflow-ai1.abdrhmanahmd2022.workers.dev"
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          node <<'NODE'
          const crypto = require('node:crypto');
          const { chromium } = require('playwright');

          const runId = process.env.GITHUB_RUN_ID;
          const testName = `Sinan E2E Clinic ${runId}`;
          const patientName = `Sinan Test Patient ${runId}`;
          const pass = `Sinan-E2E-${crypto.randomBytes(20).toString('hex')}!A`;
          let email = '';
          let mailboxId = '';
          let mailboxToken = '';
          let browser;
          const results = {
            signupPage: false,
            signupFormSubmitted: false,
            confirmationEmailRequired: null,
            confirmationEmailReceived: false,
            emailConfirmed: false,
            clinicCreated: false,
            patientCreated: false,
            patientReadBack: false,
            appointmentCreated: false,
            manualVisitCreated: false,
            recordingSessionCreated: false,
            emptyRecordingSafelyRejected: false,
            blockers: [],
          };
          async function jsonFetch(url, options = {}) {
            const response = await fetch(url, { ...options, signal: AbortSignal.timeout(15000) });
            let body = {};
            try { body = await response.json(); } catch {}
            return { response, body };
          }
          async function mailboxRequest(path, options = {}) {
            return jsonFetch(`https://api.mail.tm${path}`, options);
          }

          (async () => {
            try {
              const { response: domainResponse, body: domainBody } = await mailboxRequest('/domains');
              const domains = domainBody['hydra:member'] || [];
              const domain = domains.find(d => d.isActive && !d.isPrivate)?.domain || domains.find(d => d.isActive)?.domain;
              if (!domainResponse.ok || !domain) throw new Error('Temporary mailbox provider did not return an active domain.');

              email = `sinan-e2e-${runId}-${process.env.GITHUB_RUN_ATTEMPT}@${domain}`;
              const mailboxPassword = `Mbox-${crypto.randomBytes(24).toString('hex')}!A`;
              const { response: createMailboxResponse, body: mailbox } = await mailboxRequest('/accounts', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ address: email, password: mailboxPassword }),
              });
              if (!createMailboxResponse.ok || !mailbox.id) throw new Error(`Temporary mailbox creation failed (HTTP ${createMailboxResponse.status}).`);
              mailboxId = mailbox.id;
              const { response: tokenResponse, body: tokenBody } = await mailboxRequest('/token', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ address: email, password: mailboxPassword }),
              });
              if (!tokenResponse.ok || !tokenBody.token) throw new Error('Temporary mailbox authentication failed.');
              mailboxToken = tokenBody.token;

              browser = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
              const context = await browser.newContext();
              const page = await context.newPage();
              await page.goto(`${process.env.APP_BASE_URL}/sign-up`, { waitUntil: 'domcontentloaded', timeout: 30000 });
              results.signupPage = (await page.title()).length > 0 && await page.locator('form').count() > 0;
              await page.locator('input[autocomplete="name"]').fill('Sinan Automated Test');
              await page.locator('input[type="email"]').fill(email);
              await page.locator('input[autocomplete="new-password"]').nth(0).fill(pass);
              await page.locator('input[autocomplete="new-password"]').nth(1).fill(pass);
              await page.getByRole('button', { name: 'إنشاء الحساب والمتابعة' }).click();
              results.signupFormSubmitted = true;

              let signupState = 'pending';
              for (let i = 0; i < 12; i++) {
                if (await page.locator('.inline-error').count()) {
                  const errorText = (await page.locator('.inline-error').first().innerText()).trim();
                  results.blockers.push(errorText.includes('SMTP') || errorText.includes('إرسال رسالة التأكيد') || errorText.includes('email') ? 'email_delivery_rejected' : 'signup_form_error');
                  console.log(JSON.stringify({ stage: 'signup', outcome: 'error', error: errorText.slice(0, 240) }));
                  signupState = 'error';
                  break;
                }
                if (await page.getByRole('heading', { name: 'تحقق من بريدك الإلكتروني' }).count()) {
                  results.confirmationEmailRequired = true;
                  signupState = 'confirmation';
                  break;
                }
                if (new URL(page.url()).pathname === '/onboarding') {
                  results.confirmationEmailRequired = false;
                  signupState = 'onboarding';
                  break;
                }
                await page.waitForTimeout(1500);
              }

              if (signupState === 'confirmation') {
                let verifyUrl = '';
                for (let i = 0; i < 18 && !verifyUrl; i++) {
                  const { response: inboxResponse, body: inboxBody } = await mailboxRequest('/messages', {
                    headers: { Authorization: `Bearer ${mailboxToken}` },
                  });
                  const messages = inboxBody['hydra:member'] || [];
                  for (const message of messages) {
                    const { response: messageResponse, body: detail } = await mailboxRequest(`/messages/${encodeURIComponent(message.id)}`, {
                      headers: { Authorization: `Bearer ${mailboxToken}` },
                    });
                    if (!messageResponse.ok) continue;
                    const rawBody = [detail.text || '', ...(Array.isArray(detail.html) ? detail.html : [detail.html || '']), detail.intro || ''].join('\n')
                      .replace(/&amp;/g, '&').replace(/&#x3D;/gi, '=').replace(/&quot;/g, '"');
                    const hrefs = [...rawBody.matchAll(/href\s*=\s*["']([^"']+)["']/gi)].map(m => m[1]);
                    const plainUrls = rawBody.match(/https?:\/\/[^\s"'<>]+/g) || [];
                    verifyUrl = [...hrefs, ...plainUrls].map(u => u.replace(/&amp;/g, '&')).find(u => {
                      try { const parsed = new URL(u); return parsed.pathname.includes('/auth/v1/verify'); } catch { return false; }
                    }) || '';
                    if (verifyUrl) break;
                  }
                  if (!verifyUrl) await page.waitForTimeout(3000);
                }
                results.confirmationEmailReceived = Boolean(verifyUrl);
                if (verifyUrl) {
                  await page.goto(verifyUrl, { waitUntil: 'domcontentloaded', timeout: 45000 }).catch(() => {});
                  await page.waitForTimeout(2500);
                  const url = new URL(page.url());
                  results.emailConfirmed = url.pathname === '/onboarding' || url.pathname === '/';
                  if (url.pathname !== '/onboarding' && url.pathname !== '/') {
                    await page.waitForURL(u => u.pathname === '/onboarding' || u.pathname === '/', { timeout: 20000 }).catch(() => {});
                    const settled = new URL(page.url());
                    results.emailConfirmed = settled.pathname === '/onboarding' || settled.pathname === '/';
                  }
                } else {
                  results.blockers.push('confirmation_email_not_received');
                }
              }

              if (signupState === 'onboarding' || results.emailConfirmed) {
                if (new URL(page.url()).pathname !== '/onboarding') await page.goto(`${process.env.APP_BASE_URL}/onboarding`, { waitUntil: 'domcontentloaded' });
                await page.locator('input').nth(0).fill(testName);
                await page.locator('input').nth(1).fill(`Sinan Smoke ${runId}`);
                await page.getByRole('button', { name: 'إنشاء العيادة' }).click();
                await page.waitForTimeout(3000);
                results.clinicCreated = new URL(page.url()).pathname === '/';
                if (results.clinicCreated) {
                  const apiResults = await page.evaluate(async ({ runId, patientName }) => {
                    async function call(path, method = 'GET', payload) {
                      const options = { method, headers: { 'Content-Type': 'application/json' }, cache: 'no-store' };
                      if (payload !== undefined) options.body = JSON.stringify(payload);
                      const response = await fetch(path, options);
                      const body = await response.json().catch(() => ({}));
                      return { status: response.status, body };
                    }
                    const output = {};
                    const patient = await call('/api/patients', 'POST', {
                      full_name: patientName, reported_age_years: 35,
                      chief_complaint: 'Automated smoke test only — no real clinical information',
                    });
                    output.patient = { status: patient.status, hasId: Boolean(patient.body.patient?.id) };
                    if (!patient.body.patient?.id || patient.status !== 201) return output;
                    const patientId = patient.body.patient.id;
                    const list = await call('/api/patients');
                    output.patientReadBack = { status: list.status, found: (list.body.patients || []).some(p => p.id === patientId) };
                    const start = new Date(Date.now() + 3 * 24 * 60 * 60 * 1000);
                    start.setSeconds(0, 0);
                    const end = new Date(start.getTime() + 30 * 60 * 1000);
                    const appointment = await call('/api/appointments', 'POST', {
                      patient_id: patientId, scheduled_start: start.toISOString(),
                      scheduled_end: end.toISOString(), timezone: 'Asia/Aden',
                      appointment_type: 'dental_visit', note: 'Automated E2E smoke test; remove after test',
                    });
                    output.appointment = { status: appointment.status, hasId: Boolean(appointment.body.appointment?.id) };
                    const visit = await call(`/api/patients/${patientId}/encounters`, 'POST', {
                      chief_complaint: 'Automated smoke test only — no real clinical information',
                      encounter_type: 'dental_visit',
                    });
                    output.visit = { status: visit.status, hasEncounter: Boolean(visit.body.encounter?.id), hasNote: Boolean(visit.body.note?.id) };
                    const recording = await call('/api/recordings', 'POST', {
                      patient_id: patientId, content_type: 'audio/webm', consent_confirmed: true,
                    });
                    output.recording = { status: recording.status, hasId: Boolean(recording.body.recording_id), hasEncounter: Boolean(recording.body.encounter_id) };
                    if (recording.body.recording_id) {
                      const finish = await call(`/api/recordings/${recording.body.recording_id}/finish`, 'POST', {});
                      output.emptyRecordingGuard = {
                        status: finish.status,
                        rejectedAsExpected: finish.status === 409 && String(finish.body.error || '').includes('لم يصل أي مقطع صوت'),
                      };
                    }
                    return output;
                  }, { runId: String(runId), patientName });
                  results.patientCreated = apiResults.patient?.status === 201;
                  results.patientReadBack = apiResults.patientReadBack?.status === 200 && apiResults.patientReadBack?.found === true;
                  results.appointmentCreated = apiResults.appointment?.status === 201;
                  results.manualVisitCreated = apiResults.visit?.status === 201 && apiResults.visit?.hasNote;
                  results.recordingSessionCreated = apiResults.recording?.status === 201 && apiResults.recording?.hasId;
                  results.emptyRecordingSafelyRejected = apiResults.emptyRecordingGuard?.rejectedAsExpected === true;
                  for (const [key, value] of Object.entries(apiResults)) {
                    const status = value?.status;
                    if (typeof status === 'number' && status >= 400) results.blockers.push(`${key}_http_${status}`);
                  }
                }
              }
            } catch (error) {
              results.blockers.push(error?.name || 'unknown_error');
              console.log(JSON.stringify({ stage: 'e2e_exception', errorType: error?.name || 'Error', message: String(error?.message || '').slice(0, 180) }));
            } finally {
              if (browser) await browser.close().catch(() => {});
              if (mailboxId && mailboxToken) {
                await mailboxRequest(`/accounts/${encodeURIComponent(mailboxId)}`, {
                  method: 'DELETE', headers: { Authorization: `Bearer ${mailboxToken}` },
                }).catch(() => {});
              }
              console.log(JSON.stringify({ diagnostic: 'sinan_one_time_live_e2e', testEmail: email || null, testClinicName: testName, results }));
            }
          })();
          NODE
