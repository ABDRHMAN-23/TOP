name: Deploy Sinan runtime-enabled app to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "public/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - ".env.example"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - "open-next.config.ts"
      - ".github/workflows/deploy-sinan-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sinan-cloudflare-sinan-live
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy Sinan runtime-enabled app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Next.js embeds NEXT_PUBLIC_* variables into the browser bundle at BUILD time.
      # These are Supabase's public URL and publishable key; RLS and Auth remain the security boundary.
      NEXT_PUBLIC_SUPABASE_URL: "https://djpfjbjjybpquvzacmtj.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_TkjtLbzWTqXlE18tcvGpow_XFxdTvmz"
      NEXT_PUBLIC_DEMO_MODE: "false"
      # Private Gemini key and other private settings are read from Cloudflare Worker runtime secrets/vars.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployment credentials are configured
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN; no deployment was attempted."
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::Missing or invalid GitHub Actions secret CLOUDFLARE_ACCOUNT_ID; no deployment was attempted."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run invariant and safety tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Validate live public configuration
        run: npm run preflight

      - name: Build for Cloudflare Workers
        run: npm run build:cloudflare

      - name: Verify OpenNext output exists
        shell: bash
        run: |
          test -s .open-next/worker.js
          test -d .open-next/assets

      - name: Deploy Sinan app to Cloudflare Workers
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Attach Gemini server secret from repository secret when available
        shell: bash
        env:
          GEMINI_SECRET_INPUT: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY || secrets.GOOGLE_GEMINI_API_KEY || secrets.GOOGLE_GENAI_API_KEY }}
        run: |
          if [[ -n "${GEMINI_SECRET_INPUT:-}" ]]; then
            printf '%s' "$GEMINI_SECRET_INPUT" | npx wrangler secret put GEMINI_API_KEY --config wrangler.jsonc
            echo "Gemini server secret was attached to the deployed Worker without printing its value."
          else
            echo "::warning::No supported Gemini key was available as a GitHub Actions secret. Existing Worker secret bindings remain untouched."
          fi

      - name: Check Gemini secret binding names without reading secret values
        shell: bash
        run: |
          npx wrangler secret list --config wrangler.jsonc > /tmp/sinan-secret-names.json
          node - /tmp/sinan-secret-names.json <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const list = Array.isArray(payload) ? payload : (Array.isArray(payload.result) ? payload.result : []);
          const names = list.map(item => String(item.name || '')).filter(name => /GEMINI|GOOGLE.*API|GENAI/i.test(name));
          const expected = ['GEMINI_API_KEY','GOOGLE_API_KEY','GOOGLE_GEMINI_API_KEY','GOOGLE_GENAI_API_KEY','GOOGLE_GENERATIVE_AI_API_KEY','GEMINI_KEY'];
          console.log(JSON.stringify({ geminiSecretBindingNames: names, knownNamePresent: expected.some(name => names.includes(name)) }));
          NODE

      - name: Read deployed binding names only (never log values)
        shell: bash
        run: |
          curl --silent --show-error --fail \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/aqarflow-ai1/settings" \
            -o /tmp/sinan-worker-settings.json
          node - /tmp/sinan-worker-settings.json <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (payload.success !== true) {
            console.log(JSON.stringify({ bindingMetadataAvailable: false }));
            process.exit(0);
          }
          const bindings = Array.isArray(payload.result?.bindings) ? payload.result.bindings : [];
          const safeBindings = bindings.map(({name, type}) => ({name, type}));
          const relevant = safeBindings.filter(x => /SUPABASE|DEMO|GEMINI|GOOGLE|GENAI|AUDIO|MODEL/i.test(String(x.name || '')));
          console.log(JSON.stringify({ bindingMetadataAvailable: true, relevantBindings: relevant }));
          NODE

      - name: Check previous Worker versions for existing Gemini bindings (names only)
        shell: bash
        run: |
          curl --silent --show-error --fail \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/aqarflow-ai1/versions?per_page=10" \
            -o /tmp/sinan-worker-versions.json
          node - /tmp/sinan-worker-versions.json <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const versions = Array.isArray(p.result) ? p.result : [];
          console.log(JSON.stringify({previousWorkerVersionCount: Math.max(0,versions.length-1), versions: versions.map(v=>({id:v.id,number:v.number,created_on:v.metadata?.created_on,source:v.metadata?.source}))}));
          NODE
          for version in $(node -e "const p=require('/tmp/sinan-worker-versions.json'); console.log((p.result||[]).slice(1,10).map(v=>v.id).filter(Boolean).join(' '))"); do
            curl --silent --show-error --fail \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/aqarflow-ai1/versions/$version" \
              -o /tmp/sinan-old-version.json
            node - /tmp/sinan-old-version.json <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const bindings = p.result?.resources?.bindings || p.result?.bindings || [];
          const relevant = bindings.filter(b=>/GEMINI|GOOGLE.*API|GENAI/i.test(String(b.name||''))).map(b=>({name:b.name,type:b.type}));
          if (relevant.length) console.log(JSON.stringify({versionNumber:p.result?.number,geminiBindingNames:relevant}));
          NODE
          done

      - name: Verify signup page and compiled browser Supabase configuration
        shell: bash
        run: |
          base="https://aqarflow-ai1.abdrhmanahmd2022.workers.dev"
          page_status="$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused --output /tmp/sinan-sign-up.html --write-out "%{http_code}" "$base/sign-up")"
          node - "$page_status" /tmp/sinan-sign-up.html <<'NODE'
          const fs = require('node:fs');
          const status = Number(process.argv[2]);
          const html = fs.readFileSync(process.argv[3], 'utf8');
          const formRendered = html.includes('إنشاء حساب طبيب أو مدير عيادة');
          const directEntryRendered = html.includes('إنشاء حساب') || html.includes('sign-up');
          console.log(JSON.stringify({ signupPageStatus: status, signupFormRendered: formRendered, signupEntryRendered: directEntryRendered }));
          if (status !== 200 || !formRendered) process.exit(1);
          NODE
          grep -oE '/_next/static/[^" ]+\.js' /tmp/sinan-sign-up.html | sort -u > /tmp/sinan-js-chunks.txt
          : > /tmp/sinan-client-bundle.js
          while IFS= read -r chunk; do
            curl --silent --show-error --fail --retry 3 --retry-delay 1 "$base$chunk" >> /tmp/sinan-client-bundle.js
            printf '\\n' >> /tmp/sinan-client-bundle.js
          done < /tmp/sinan-js-chunks.txt
          node - /tmp/sinan-client-bundle.js <<'NODE'
          const fs = require('node:fs');
          const js = fs.readFileSync(process.argv[2], 'utf8');
          const projectUrlPresent = js.includes('djpfjbjjybpquvzacmtj.supabase.co');
          const publishableKeyPresent = js.includes('sb_publishable_');
          const placeholderPresent = /YOUR_PROJECT\\.supabase\\.co|YOUR_SUPABASE_ANON_KEY/.test(js);
          console.log(JSON.stringify({ compiledSupabaseProjectPresent: projectUrlPresent, compiledPublicKeyPresent: publishableKeyPresent, stalePlaceholderPresent: placeholderPresent }));
          if (!projectUrlPresent || !publishableKeyPresent || placeholderPresent) process.exit(1);
          NODE

      - name: Smoke-test deployed Supabase and runtime configuration
        shell: bash
        run: |
          url="https://aqarflow-ai1.abdrhmanahmd2022.workers.dev/api/health/ready"
          curl --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused \
            --output /tmp/sinan-readiness.json --write-out "%{http_code}" "$url" > /tmp/sinan-readiness-status
          status="$(cat /tmp/sinan-readiness-status)"
          node - "$status" /tmp/sinan-readiness.json <<'NODE'
          const fs = require('node:fs');
          const status = Number(process.argv[2]);
          const payload = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          console.log(JSON.stringify({ httpStatus: status, ready: payload.ready, checks: payload.checks }));
          if (status !== 200 || payload.ready !== true) process.exit(1);
          NODE

      # One-time diagnostic, guarded by this exact commit title so it never runs on later deployments.
      - name: Probe live signup endpoint once with a disposable invalid-domain address
        if: github.event_name == 'push' && github.event.head_commit.message == 'Probe live signup endpoint once for Sinan smoke test'
        shell: bash
        env:
          AUTH_BASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          AUTH_PUBLIC_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const email = `sinan-smoke-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}@example.invalid`;
          const password = `SinanSmoke-${crypto.randomBytes(24).toString('hex')}!A`;
          (async () => {
            try {
              const response = await fetch(`${process.env.AUTH_BASE_URL}/auth/v1/signup`, {
                method: 'POST',
                headers: { apikey: process.env.AUTH_PUBLIC_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, data: { full_name: 'Sinan automated smoke test', account_type: 'clinic_owner' } }),
                signal: AbortSignal.timeout(15000),
              });
              const payload = await response.json().catch(() => ({}));
              const user = payload.user || payload;
              const errorCode = payload.error_code || payload.code || null;
              console.log(JSON.stringify({
                diagnostic: 'one_time_signup_probe',
                httpStatus: response.status,
                userReturned: Boolean(user && user.id),
                confirmationRequired: Boolean(user && user.id && !payload.session),
                sessionReturned: Boolean(payload.session),
                errorCode: typeof errorCode === 'string' ? errorCode.slice(0, 80) : null,
                cleanupTag: `sinan-smoke-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}@example.invalid`,
              }));
            } catch (error) {
              console.log(JSON.stringify({ diagnostic: 'one_time_signup_probe', requestFailed: true, errorType: error?.name || 'Error' }));
            }
          })();
          NODE
