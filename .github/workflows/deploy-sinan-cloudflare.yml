name: Deploy Sinan demo to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - "open-next.config.ts"
      - ".github/workflows/deploy-sinan-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sinan-cloudflare-aqarflow-ai1
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy demo to aqarflow-ai1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_DEMO_MODE: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployment credentials are configured
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN; no deployment was attempted."
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::Missing or invalid GitHub Actions secret CLOUDFLARE_ACCOUNT_ID; no deployment was attempted."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run invariant and safety tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Validate demo configuration
        run: npm run preflight

      - name: Build for Cloudflare Workers
        run: npm run build:cloudflare

      - name: Verify OpenNext output exists
        shell: bash
        run: |
          test -s .open-next/worker.js
          test -d .open-next/assets

      - name: Deploy Sinan demo to aqarflow-ai1
        run: npx wrangler deploy --config wrangler.jsonc
